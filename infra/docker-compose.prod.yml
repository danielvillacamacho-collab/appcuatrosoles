# La pila del servidor (`docs/07` §1). Se copia a la EC2 junto con el `.env`.
#
# Diferencias con el compose de desarrollo, y ninguna es cosmética:
#   · PostgreSQL **no publica su puerto**. Sólo lo alcanzan los contenedores por la red interna.
#   · Las credenciales salen del `.env` de la instancia, no van escritas aquí.
#   · Los datos viven en el volumen EBS montado en `/var/lib/postgresql`, no en un volumen de Docker.
#   · Las imágenes se traen etiquetadas, no se construyen en el servidor: desplegar es cambiar
#     `IMAGE_TAG`, y volver atrás es cambiarla de vuelta (`infra/rollback.sh`).
#   · Las imágenes viven en ECR, no en GHCR: la instancia hace `pull` con las credenciales de su
#     propio rol (`infra/terraform/iam.tf`), sin login ni token de GitHub guardado en ningún lado.

# Rotación de logs, común a los tres servicios.
#
# **Sin esto Docker escribe sin límite.** El controlador por defecto es `json-file` y no rota nada:
# en una `t3.small` con el disco compartido con el sistema, unos meses de logs del API llenan la
# partición y lo que se cae no es el logging, es todo. Con 20 MB por archivo y 5 archivos quedan
# 100 MB por servicio y varios días de historia, que es lo que hace falta para investigar algo que
# alguien reportó ayer.
x-logs: &logs
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"

name: cuatrosoles

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    logging: *logs
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      # El volumen EBS dedicado, montado por `user-data.sh`. `PGDATA` en un subdirectorio porque
      # PostgreSQL se niega a inicializar sobre un punto de montaje que ya tiene `lost+found`.
      - /var/lib/postgresql/datos:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    image: ${ECR_REGISTRY}/cuatrosoles-${ENTORNO}-api:${IMAGE_TAG:-latest}
    restart: unless-stopped
    logging: *logs
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "3000"
    healthcheck:
      # `/api/ready` y no `/api/health`: el primero comprueba además que la base responde. Un
      # proceso vivo que no puede consultar nada no está listo para recibir tráfico.
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:3000/api/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  caddy:
    image: ${ECR_REGISTRY}/cuatrosoles-${ENTORNO}-caddy:${IMAGE_TAG:-latest}
    restart: unless-stopped
    logging: *logs
    environment:
      # El mismo valor que recibe el API. Si no coinciden, Caddy sirve el sitio y el API responde
      # 404 a todo.
      BASE_DOMAIN: ${BASE_DOMAIN}
      AWS_REGION: ${AWS_REGION:-us-east-1}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # Los certificados emitidos. Sin persistirlos, cada reinicio pide certificados nuevos y
      # Let's Encrypt limita a cinco por semana por dominio: al sexto reinicio, el sitio se queda
      # sin HTTPS durante días.
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_started

# NOTA: no hay servicio `worker`. Hoy la bandeja de salida la vacía un temporizador dentro del
# propio proceso del API (`OutboxScheduler`). El worker aparte entra con `pg-boss` (`ADR-012`), y
# declararlo antes sería un contenedor que se reinicia en bucle buscando un archivo que no existe.

volumes:
  caddy_data:
  caddy_config:
