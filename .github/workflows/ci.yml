# ADR-014 — barreras automáticas que reemplazan la revisión de código humana.
# Cada gate reporta en español qué se rompió (docs/09-open-questions.md D-04).
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality-gates:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: polo
          POSTGRES_PASSWORD: polo
          POSTGRES_DB: polo_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://polo:polo@localhost:5432/polo_test
    steps:
      - uses: actions/checkout@v4

      # Sin `version`: la toma de `packageManager` del package.json. Declararla también
      # aquí hace fallar la acción con «Multiple versions of pnpm specified», y además
      # sería un segundo lugar que mantener sincronizado.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Lint (sin any, sin @ts-ignore, sin console.log — ADR-014 punto 10)
        run: pnpm lint

      - name: Typecheck estricto
        run: pnpm typecheck

      - name: Fitness functions de arquitectura (dependency-cruiser)
        run: pnpm check:arch

      # CLAUDE.md: toda migración es reversible y se prueba contra Postgres real.
      # Prisma no genera el `down` solo, así que cada migración lleva su `down.sql` al lado
      # (ver docs/05-testing-strategy.md §6). Este paso prueba el ciclo completo: aplicar,
      # revertir la última, y volver a aplicarla.
      - name: Migraciones — up, down, up contra Postgres real
        run: |
          set -euo pipefail
          pnpm db:migrate:deploy

          ULTIMA=$(ls -d apps/api/prisma/migrations/*/ | sort | tail -1)
          NOMBRE=$(basename "$ULTIMA")
          if [ ! -f "${ULTIMA}down.sql" ]; then
            echo "::error::La migración ${NOMBRE} no tiene down.sql. Toda migración debe ser reversible (CLAUDE.md)."
            exit 1
          fi

          echo "Revirtiendo ${NOMBRE}..."
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -q -f "${ULTIMA}down.sql"
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -q \
            -c "DELETE FROM _prisma_migrations WHERE migration_name = '${NOMBRE}';"

          echo "Re-aplicando ${NOMBRE}..."
          pnpm db:migrate:deploy

      - name: Tests con umbrales de cobertura (docs/05 §2)
        run: pnpm test:cov

      # Levantan su propio PostgreSQL con Testcontainers (docs/05 §5), independiente del
      # servicio `postgres` de arriba: cada corrida parte de una base nueva, que es la única
      # forma de que un test que escribe en `audit_log` no arrastre el estado del anterior.
      - name: Tests de integración contra PostgreSQL real
        run: pnpm test:int

      - name: Prueba de aislamiento de tenant por endpoint (ADR-014 punto 3)
        run: pnpm check:isolation

      - name: Build
        run: pnpm build

      - name: Presupuesto de bundle (ADR-014 punto 9)
        # Después del build, porque mide lo que el build produjo. Va en el mismo trabajo para que
        # un `pnpm build` que pasa y un bundle que engorda no se reporten como cosas distintas.
        run: pnpm --filter @polo/web check:bundle

      - name: Escaneo de secretos en el diff
        uses: gitleaks/gitleaks-action@v2

  e2e:
    runs-on: ubuntu-latest
    needs: quality-gates
    if: github.ref == 'refs/heads/main'
    services:
      # Para los E2E de **navegador**: Playwright levanta el API de verdad, y ése necesita una base
      # a la que conectarse. Los E2E de API no lo usan — traen su propio PostgreSQL con
      # Testcontainers (`docs/05` §5).
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: polo
          POSTGRES_PASSWORD: polo
          POSTGRES_DB: polo_e2e
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://polo:polo@localhost:5432/polo_e2e
      BASE_DOMAIN: localhost
      # El puerto de Vite: sin él los enlaces de los correos apuntan a una dirección sin puerto que
      # en desarrollo no responde. Ver `club/url-del-club.ts`.
      WEB_PORT: "5173"
      SESSION_SECRET: secreto-de-ci
      CSRF_SECRET: secreto-de-ci
    steps:
      - uses: actions/checkout@v4
      # Sin `version`: la toma de `packageManager` del package.json. Declararla también
      # aquí hace fallar la acción con «Multiple versions of pnpm specified», y además
      # sería un segundo lugar que mantener sincronizado.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # `pnpm test:e2e` recorre los flujos completos: los de **API** contra un PostgreSQL de
      # Testcontainers (`apps/api/test/e2e`) y los de **navegador** con Playwright
      # (`apps/web/e2e`, T-128).
      - name: Navegador para Playwright
        run: pnpm --filter @polo/web exec playwright install --with-deps chromium

      # Los E2E de navegador usan el club de ejemplo (`docs/05` §8): un E2E con fixtures propios
      # termina probando su propio andamiaje.
      - name: Base de datos con el club de ejemplo
        run: |
          set -euo pipefail
          cp .env.example .env
          sed -i "s|^DATABASE_URL=.*|DATABASE_URL=$DATABASE_URL|" .env
          pnpm db:migrate:deploy
          pnpm db:seed

      - run: pnpm test:e2e
