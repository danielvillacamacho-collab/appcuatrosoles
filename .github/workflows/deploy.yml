# Publica las imágenes del ambiente de desarrollo en GHCR.
#
# **No toca AWS.** El registro es el de GitHub y el token lo genera el propio workflow, así que
# publicar no depende de ninguna credencial de larga vida ni del rol OIDC que todavía no existe.
# Ésa fue la razón de elegir GHCR sobre ECR: quita una dependencia del camino crítico.
#
# **Publica, no despliega.** El paso que reinicia los servicios en la instancia todavía se hace a
# mano por Session Manager (`docs/07` §9). Automatizarlo necesita el rol OIDC con `ssm:SendCommand`,
# que es lo único que seguimos esperando de infraestructura; cuando llegue, se agrega un job más
# acá y este archivo no cambia en nada más.
name: Publicar imágenes

on:
  # **Después de CI, y sólo si pasó.** Antes esto corría en cada push a `main`, lo que significaba
  # que `latest` podía apuntar a un commit con los tests en rojo. Ahora no puede: la instancia se
  # despliega sola siguiendo `latest` (`infra/auto-desplegar.sh`), así que esa etiqueta es la que
  # decide qué corre en el ambiente donde el club está probando.
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  # Para volver a publicar una versión anterior sin tener que empujar un commit.
  workflow_dispatch:
    inputs:
      ref:
        description: "Commit o rama a publicar"
        required: false
        default: main

concurrency:
  # Dos publicaciones a la vez sobre la misma etiqueta `latest` dejan la etiqueta apuntando a
  # cualquiera de las dos. Se cancela la vieja: la que importa es la última.
  group: publicar-${{ github.ref }}
  cancel-in-progress: true

env:
  ENTORNO: dev
  REGISTRO: ghcr.io/${{ github.repository_owner }}

jobs:
  publicar:
    runs-on: ubuntu-latest
    # Un `workflow_run` se dispara también cuando CI **falla**: sin esta condición, publicaríamos
    # justo la versión que los tests acaban de rechazar.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    permissions:
      contents: read
      packages: write

    steps:
      - name: Resolver el commit que se publica
        run: |
          SHA="${{ github.event.inputs.ref || github.event.workflow_run.head_sha || github.sha }}"
          echo "SHA=$SHA" >> "$GITHUB_ENV"

      - uses: actions/checkout@v4
        with:
          # Con `workflow_run`, `github.sha` es el de la rama por defecto y no el del commit que
          # disparó CI: hay que tomarlo del evento o se publicaría una versión distinta de la que
          # se probó.
          ref: ${{ github.event.inputs.ref || github.event.workflow_run.head_sha || github.ref }}

      - uses: docker/setup-buildx-action@v3

      - name: Entrar a GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # **La instancia es x86_64.** Sin fijar la plataforma, un runner arm publicaría imágenes que
      # el servidor no puede correr, y se descubriría en el arranque con el ambiente ya detenido.
      # Es la misma advertencia que lleva `infra/deploy-to-ecr.sh`.
      - name: Publicar el API
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          platforms: linux/amd64
          push: true
          build-args: |
            APP_VERSION=${{ env.SHA }}
          tags: |
            ${{ env.REGISTRO }}/cuatrosoles-${{ env.ENTORNO }}-api:${{ env.SHA }}
            ${{ env.REGISTRO }}/cuatrosoles-${{ env.ENTORNO }}-api:latest
          labels: org.opencontainers.image.revision=${{ env.SHA }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Publicar Caddy (lleva la SPA adentro)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/caddy.Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.REGISTRO }}/cuatrosoles-${{ env.ENTORNO }}-caddy:${{ env.SHA }}
            ${{ env.REGISTRO }}/cuatrosoles-${{ env.ENTORNO }}-caddy:latest
          labels: org.opencontainers.image.revision=${{ env.SHA }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Cómo desplegar lo que se acaba de publicar
        run: |
          {
            echo "## Imágenes publicadas"
            echo ""
            echo '```'
            echo "${{ env.REGISTRO }}/cuatrosoles-${{ env.ENTORNO }}-api:${{ env.SHA }}"
            echo "${{ env.REGISTRO }}/cuatrosoles-${{ env.ENTORNO }}-caddy:${{ env.SHA }}"
            echo '```'
            echo ""
            echo "En la instancia, por Session Manager:"
            echo ""
            echo '```bash'
            echo "cd /srv/cuatrosoles && IMAGE_TAG=${{ env.SHA }} ./desplegar.sh"
            echo '```'
            echo ""
            echo "Para volver atrás: el mismo comando con el \`IMAGE_TAG\` anterior."
          } >> "$GITHUB_STEP_SUMMARY"
